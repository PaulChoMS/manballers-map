<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>맨발맵 - 위치보기</title>
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- autoload=false 파라미터 추가 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8e4a257eca1c9537964f714d2d32f3be&autoload=false"></script>
  <script>
    // 카카오 지도 API 로드가 완료된 후 안전하게 실행
    kakao.maps.load(function() {
      function getParam(name, fallback) {
        var params = new URLSearchParams(window.location.search);
        var value = params.get(name);
        return value !== null ? value : fallback;
      }

      var lat = parseFloat(getParam('lat', '37.5665'));
      var lng = parseFloat(getParam('lng', '126.9780'));
      var name = decodeURIComponent(getParam('name', ''));

      var map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(lat, lng),
        level: 3
      });

      var marker = new kakao.maps.Marker({
        position: new kakao.maps.LatLng(lat, lng),
        map: map
      });

      if (name) {
        var infowindow = new kakao.maps.InfoWindow({
          content: '<div style="padding:6px 10px;font-size:13px;white-space:nowrap;">' + name + '</div>'
        });
        infowindow.open(map, marker);
      }
    });
  </script>
</body>
</html>
