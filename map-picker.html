<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>맨발맵 - 위치 정하기</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- 카카오 JS 키는 공개해도 되는 값이에요 (비밀키 아님, 도메인 제한으로 보안 처리됨) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8e4a257eca1c9537964f714d2d32f3be"></script>
  <script>
    function getParam(name, fallback) {
      var params = new URLSearchParams(window.location.search);
      var value = params.get(name);
      return value !== null ? value : fallback;
    }

    var lat = parseFloat(getParam('lat', '37.5665'));
    var lng = parseFloat(getParam('lng', '126.9780'));

    var map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(lat, lng),
      level: 3
    });

    var imageSrc = 'https://t1.daumcdn.net/mapjsapi/images/marker.png';
    var imageSize = new kakao.maps.Size(45, 52);
    var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);
    var marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(lat, lng),
      image: markerImage,
      draggable: true
    });
    marker.setMap(map);

    function sendPosition(pos) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ lat: pos.getLat(), lng: pos.getLng() }));
    }

    kakao.maps.event.addListener(map, 'click', function (mouseEvent) {
      marker.setPosition(mouseEvent.latLng);
      sendPosition(mouseEvent.latLng);
    });
    kakao.maps.event.addListener(marker, 'dragend', function () {
      sendPosition(marker.getPosition());
    });
  </script>
</body>
</html>
